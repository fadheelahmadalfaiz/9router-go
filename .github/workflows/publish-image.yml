name: Publish Image

# Publishes a multi-arch image to GHCR so deployments can pull a prebuilt
# artifact instead of rebuilding the Go binary + Svelte SPA on the target host.
#
# Tags produced (all pointing at the same digest):
#   latest                  - newest build from the default branch
#   <VERSION>               - e.g. 1.9.5, from the VERSION file
#   v<VERSION>              - e.g. v1.9.5, mirrors the release tag convention
#   sha-<short-sha>         - immutable, for pinning a rollback target
#   main                    - moving alias for the default branch
#
# Only the default branch publishes. Feature branches build the multi-arch
# image but push nothing, so a PR cannot overwrite a released tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image (unset to build only, as a dry run)"
        type: boolean
        default: true
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------
  # 0. Skip entirely for PRs from forks: they cannot write packages, and
  #    a duplicate build wastes runner minutes.
  # -------------------------------------------------------------------
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and image name
        id: meta
        run: |
          # ghcr.io requires the lowercase owner/repo path.
          IMAGE_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          VERSION=$(cat VERSION 2>/dev/null | tr -d '[:space:]' || echo "")
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)

          {
            echo "image=${REGISTRY}/${IMAGE_LC}"
            echo "version=$VERSION"
            echo "sha_short=$SHA_SHORT"
          } >> "$GITHUB_OUTPUT"

          echo "Image:  ${REGISTRY}/${IMAGE_LC}"
          echo "Version: ${VERSION:-<none>}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: dockermeta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.dockermeta.outputs.tags }}
          labels: ${{ steps.dockermeta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # mode=max keeps the whole layer cache; the Go + Bun stages are the
          # expensive part and reuse here is what makes the hourly sync cheap.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION_OUT: ${{ steps.meta.outputs.version }}
          DIGEST_OUT: ${{ steps.build.outputs.digest }}
          TAGS_OUT: ${{ steps.dockermeta.outputs.tags }}
        run: |
          {
            echo "### Publish Image"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Image | $IMAGE |"
            echo "| Version | $VERSION_OUT |"
            echo "| SHA | ${{ github.sha }} |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Digest | ${DIGEST_OUT:-n/a} |"
            echo ""
            echo "### Tags"
            echo ""
            echo '```'
            echo "$TAGS_OUT"
            echo '```'
            echo ""
            echo "### Pull"
            echo ""
            echo '```bash'
            echo "docker pull $IMAGE:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
