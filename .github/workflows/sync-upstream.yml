name: Sync Upstream

# Keeps this fork's `main` aligned with its real upstream so fixes and provider
# updates land here without a manual merge. Runs on a schedule, on manual
# dispatch, and whenever upstream pushes (via `repository_dispatch` sent by the
# upstream repo's own notify job, if configured).
#
# Merge strategy: a real merge, no `-X theirs`.
#
# This fork DOES carry local patches (the dashboard's Logs tab and chart set, the
# extra usage handlers, the batch test endpoint, the URL-state helpers). The old
# `-X theirs` resolved every conflict in upstream's favour, so each sync silently
# discarded those patches while leaving their files and tests behind — which is
# how `MainTab` lost `'logs'` and `fetchProviderUsage` lost ten provider cases
# while their tests still expected them. A conflicted merge fails loudly here
# instead, and a human resolves it once.
#
# NOTE: `cancel-in-progress: false` is deliberate. Overlapping runs against the
# same branch race on the push and can leave the working tree mid-rebase; a
# queued run is cheaper than a broken branch.

on:
  schedule:
    # Hourly at :07 — offset from the 15-minute slot the 9router sync used so
    # the two forks never contend for the same runner window.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Merge upstream but do not trigger a container rebuild"
        type: boolean
        default: false

permissions:
  contents: write

# NOTE on workflow-file permissions
# ---------------------------------
# A merge that updates anything under .github/workflows/ is rejected by the
# remote with:
#   refusing to allow a GitHub App to create or update workflow
#   `.github/workflows/ci.yml` without `workflows` permission
#
# `workflows` is not a key the `permissions:` block accepts, so the grant has
# to live at the repository level instead. This workflow therefore depends on:
#   Settings -> Actions -> General -> Workflow permissions
#     -> "Read and write permissions"
#   (API: PATCH /repos/{owner}/{repo}/actions/permissions/workflow
#         {"default_workflow_permissions": "write"})
# Without it, every scheduled sync that pulls a CI change fails on push.

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  # The real upstream for this fork.
  UPSTREAM_REPO: luqman-v1/9router-go
  UPSTREAM_BRANCH: main
  BRANCH: main

jobs:
  sync:
    name: Merge upstream into fork
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          # Full history is required: the merge is a real git merge, not a
          # squash, and a shallow clone would drop the common ancestor.
          fetch-depth: 0
          # checkout otherwise stores its own GITHUB_TOKEN in an
          # http.https://github.com/.extraheader config entry, and that entry
          # takes precedence over the remote URL — so the "Authorize push"
          # step below would be silently ignored and the push would still be
          # attributed to the GitHub App. Turning it off makes SYNC_TOKEN the
          # only credential in play.
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch --no-tags upstream "${{ env.UPSTREAM_BRANCH }}:refs/remotes/upstream/${{ env.UPSTREAM_BRANCH }}"

      - name: Authorize push with a workflow-capable token
        # The built-in GITHUB_TOKEN is rejected by the remote for any push that
        # touches .github/workflows/:
        #   refusing to allow a GitHub App to create or update workflow
        #   `.github/workflows/ci.yml` without `workflows` permission
        # That block cannot be lifted from the `permissions:` key (there is no
        # such key), and the repo-level "Read and write permissions" setting
        # does not change it either. Upstream regularly edits ci.yml and
        # release.yml, so the sync has to authenticate with a token that
        # carries the `workflow` scope. SYNC_TOKEN is a classic PAT with
        # `repo` + `workflow`; without it every scheduled sync that pulls a CI
        # change fails on push.
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::secret SYNC_TOKEN is not set. A push that merges an upstream change to .github/workflows/ will be rejected without it."
            exit 1
          fi
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git remote set-url origin \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${{ github.repository }}.git"
          # Prove the credential is a user token, not the GitHub App, before the
          # push so a misconfigured secret fails here instead of mid-merge.
          WHO=$(git ls-remote --exit-code origin HEAD > /dev/null 2>&1 && echo ok || echo fail)
          if [ "$WHO" != "ok" ]; then
            echo "::error::cannot authenticate to origin with SYNC_TOKEN"
            exit 1
          fi
          echo "origin authenticates with SYNC_TOKEN (workflow scope)"

      - name: Report divergence
        id: divergence
        run: |
          BEHIND=$(git rev-list --count "HEAD..upstream/${{ env.UPSTREAM_BRANCH }}" || echo 0)
          AHEAD=$(git rev-list --count "upstream/${{ env.UPSTREAM_BRANCH }}..HEAD" || echo 0)
          {
            echo "behind=$BEHIND"
            echo "ahead=$AHEAD"
          } >> "$GITHUB_OUTPUT"
          echo "behind upstream by $BEHIND commit(s); ahead by $AHEAD"
          if [ "$BEHIND" -eq 0 ]; then
            echo "::notice::Fork is already up to date with ${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_BRANCH }}"
          fi

      - name: Merge upstream
        id: merge
        if: steps.divergence.outputs.behind != '0'
        run: |
          set -uo pipefail
          # No -X theirs: a conflict here means this fork patched a file upstream
          # also changed, and discarding the fork's side is what broke the build.
          #
          # A conflict is a normal outcome for a fork that carries local patches,
          # so it is reported as an issue below rather than failing the run: an
          # hourly red job says nothing new, buries the real CI signal, and the
          # branch is never touched either way.
          if git merge --no-edit \
               "upstream/${{ env.UPSTREAM_BRANCH }}" \
               -m "chore(sync): merge upstream ${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_BRANCH }} (${{ github.run_id }})"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "conflict=true" >> "$GITHUB_OUTPUT"
          git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/conflicts.txt"
          git merge --abort
          exit 0

      - name: Report the conflict as an issue
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -uo pipefail
          CONFLICTS=$(cat "$RUNNER_TEMP/conflicts.txt")
          COUNT=$(printf '%s\n' "$CONFLICTS" | grep -c . || true)
          {
            printf 'Upstream `%s@%s` moved forward, and the merge conflicts with this fork'"'"'s local patches. Nothing was pushed: `main` is unchanged and still builds.\n\n' "${{ env.UPSTREAM_REPO }}" "${{ env.UPSTREAM_BRANCH }}"
            printf 'Resolve it locally, keeping **both** sides — the fork'"'"'s patches are why this conflicts:\n\n'
            printf '```bash\n'
            printf 'git fetch origin && git checkout main && git pull\n'
            printf 'git remote add upstream https://github.com/%s.git 2>/dev/null || true\n' "${{ env.UPSTREAM_REPO }}"
            printf 'git fetch upstream %s\n' "${{ env.UPSTREAM_BRANCH }}"
            printf 'git merge upstream/%s\n' "${{ env.UPSTREAM_BRANCH }}"
            printf '# resolve the files below, then:\n'
            printf 'git add -A && git commit && git push origin main\n'
            printf '```\n\n'
            printf 'Conflicting files (%s):\n\n```\n%s\n```\n\n' "$COUNT" "$CONFLICTS"
            printf 'Run: %s/%s/actions/runs/%s\n' "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}"
          } > "$RUNNER_TEMP/sync-body.md"
          TITLE="Sync upstream: merge conflict needs a human"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            # Edit, do not comment: the hourly schedule would otherwise post the
            # same notice 24 times a day.
            gh issue edit "$EXISTING" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/sync-body.md"
            echo "::notice::issue #$EXISTING already tracks this conflict; updated its file list"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file "$RUNNER_TEMP/sync-body.md"
          fi
          exit 0

      - name: Report what the merge brought in
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -uo pipefail
          echo "::group::commit"
          git log -1 --pretty='%h %s'
          echo "::endgroup::"
          echo "::group::files changed by the merge"
          # HEAD is the merge commit; the diff against its first parent shows
          # exactly what this sync pulled in.
          git diff --stat "HEAD^1" HEAD | tail -40
          echo "::endgroup::"
          # A merge that silently dropped a workflow file is the failure mode
          # this workflow exists to prevent, so surface it explicitly.
          CHANGED_WORKFLOWS=$(git diff --name-only "HEAD^1" HEAD -- .github/workflows/ || true)
          if [ -n "$CHANGED_WORKFLOWS" ]; then
            echo "::group::workflow files touched by this sync"
            echo "$CHANGED_WORKFLOWS"
            echo "::endgroup::"
          fi

      - name: Push to fork
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -uo pipefail
          # Someone (a manual commit, the Publish-Image job, or a PR merge) can
          # land on main between our checkout and this push, making it
          # non-fast-forward. Re-do the merge on top of the new tip rather than
          # rebasing: this commit is a merge, and `git rebase` drops merge
          # commits, which would silently rewrite the recorded sync.
          MERGE_MSG="chore(sync): merge upstream ${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_BRANCH }}"
          for ATTEMPT in 1 2 3; do
            if git push origin "HEAD:${{ env.BRANCH }}"; then
              echo "Pushed merge to origin/${{ env.BRANCH }} (attempt $ATTEMPT)"
              exit 0
            fi
            echo "::warning::push rejected on attempt $ATTEMPT"

            if [ "$ATTEMPT" -eq 3 ]; then
              break
            fi

            git fetch origin "${{ env.BRANCH }}"
            # Reset to the new origin tip, then replay the upstream merge on it.
            # Still no -X theirs: see the "Merge upstream" step for why.
            git reset --hard "origin/${{ env.BRANCH }}"
            if ! git merge --no-edit \
                 "upstream/${{ env.UPSTREAM_BRANCH }}" \
                 -m "$MERGE_MSG (${{ github.run_id }})"; then
              echo "::error::merge conflict against the new origin tip; resolve by hand"
              git diff --name-only --diff-filter=U
              git merge --abort
              exit 1
            fi
            sleep 5
          done
          echo "::error::could not push the merge after 3 attempts"
          exit 1

      - name: Summary
        if: always()
        env:
          BEHIND_OUT: ${{ steps.divergence.outputs.behind }}
          AHEAD_OUT: ${{ steps.divergence.outputs.ahead }}
          MERGED_OUT: ${{ steps.merge.outputs.merged }}
          CONFLICT_OUT: ${{ steps.merge.outputs.conflict }}
        run: |
          {
            echo "### Sync Upstream"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Upstream | ${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_BRANCH }} |"
            echo "| Branch | ${{ env.BRANCH }} |"
            echo "| Behind before sync | $BEHIND_OUT |"
            echo "| Local commits ahead | $AHEAD_OUT |"
            if [ "${CONFLICT_OUT:-false}" = "true" ]; then
              echo "| Merged | no — conflict, reported as an issue |"
            else
              echo "| Merged | ${MERGED_OUT:-no (already up to date)} |"
            fi
            echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
